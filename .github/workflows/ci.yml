name: CI

on:
  push:
    branches:
      - main
  pull_request:

# env:
#   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_INTERACTIVE: "false"
      NX_TASKS_RUNNER: "local"
      NX_CLOUD: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint/Test/Build/Typecheck (affected, excluding paused)
        run: pnpm exec nx affected -t lint test build typecheck --exclude='tag:paused' --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}
