name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_INTERACTIVE: 'false'
      NX_TASKS_RUNNER: 'local'
      NX_CLOUD: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9.8.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Determine affected base/head
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE=${{ github.event.pull_request.base.sha }}" >> $GITHUB_ENV
            echo "HEAD=${{ github.sha }}" >> $GITHUB_ENV
          else
            echo "BASE=$(git rev-parse HEAD~1)" >> $GITHUB_ENV
            echo "HEAD=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Check formatting (affected)
        run: pnpm exec nx format:check --base=$BASE --head=$HEAD

      - name: Lint/Test/Build/Typecheck (affected, excluding paused)
        run: pnpm exec nx affected -t lint test build typecheck --exclude='tag:paused' --base=$BASE --head=$HEAD
